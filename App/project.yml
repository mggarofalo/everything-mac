name: EverythingMac
options:
  bundleIdPrefix: com.everythingmac
  deploymentTarget:
    macOS: "14.0"
packages:
  IndexCore:
    path: ..
targets:
  EverythingMacIndexer:
    type: tool
    platform: macOS
    sources:
      - Shared
      - ServiceSources/Indexer
      - Sources/IndexActor.swift
      - Sources/FullDiskAccess.swift
    dependencies:
      - package: IndexCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everythingmac.app
        PRODUCT_NAME: EverythingMacIndexer
        MARKETING_VERSION: "0.6.0"
        CURRENT_PROJECT_VERSION: "11"
        SKIP_INSTALL: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ENABLE_HARDENED_RUNTIME: YES
  EverythingMacSearchService:
    type: tool
    platform: macOS
    sources: [Shared, ServiceSources/Search]
    dependencies:
      - package: IndexCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everythingmac.search
        PRODUCT_NAME: EverythingMacSearchService
        SKIP_INSTALL: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ENABLE_HARDENED_RUNTIME: YES
  EverythingMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes: [IndexActor.swift]
      - Shared
      - Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    entitlements:
      path: EverythingMac.entitlements
    dependencies:
      - package: IndexCore
      - target: EverythingMacIndexer
        embed: false
      - target: EverythingMacSearchService
        embed: false
    postBuildScripts:
      - name: Embed Background Services
        inputFiles:
          - "$(BUILT_PRODUCTS_DIR)/EverythingMacIndexer"
          - "$(BUILT_PRODUCTS_DIR)/EverythingMacSearchService"
          - "$(SRCROOT)/LaunchAgents/com.everythingmac.indexer.plist"
          - "$(SRCROOT)/LaunchAgents/com.everythingmac.search.plist"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/MacOS/EverythingMacIndexer"
          - "$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/MacOS/EverythingMacSearchService"
          - "$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Library/LaunchAgents/com.everythingmac.indexer.plist"
          - "$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Library/LaunchAgents/com.everythingmac.search.plist"
        script: |
          set -euo pipefail
          executable_dir="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/MacOS"
          agent_dir="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/Library/LaunchAgents"
          mkdir -p "${agent_dir}"
          ditto "${BUILT_PRODUCTS_DIR}/EverythingMacIndexer" "${executable_dir}/EverythingMacIndexer"
          ditto "${BUILT_PRODUCTS_DIR}/EverythingMacSearchService" "${executable_dir}/EverythingMacSearchService"
          if [[ "${CODE_SIGNING_ALLOWED:-YES}" != "NO" && -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]]; then
            /usr/bin/codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" --identifier com.everythingmac.app --options runtime "${executable_dir}/EverythingMacIndexer"
          fi
          ditto "${SRCROOT}/LaunchAgents/com.everythingmac.indexer.plist" "${agent_dir}/com.everythingmac.indexer.plist"
          ditto "${SRCROOT}/LaunchAgents/com.everythingmac.search.plist" "${agent_dir}/com.everythingmac.search.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everythingmac.app
        MARKETING_VERSION: "0.6.0"
        CURRENT_PROJECT_VERSION: "11"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: EverythingMac.entitlements
        SWIFT_VERSION: "6.0"
        # The local build script selects a signing identity at build time. Never ship
        # a repository with one contributor's certificate or team hard-coded.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ENABLE_HARDENED_RUNTIME: YES
