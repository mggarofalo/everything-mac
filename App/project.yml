name: EverythingMac
options:
  bundleIdPrefix: com.everythingmac
  deploymentTarget:
    macOS: "14.0"
packages:
  IndexCore:
    path: ..
targets:
  EverythingMacAdapterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Sources/SearchAdapters.swift
      - Sources/SearchPresentationCoordinator.swift
      - Tests/AdapterTests
    dependencies:
      - package: IndexCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everythingmac.adapter-tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
  EverythingMacAppModelTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Shared
      - Sources/AppModel.swift
      - Sources/FileIcons.swift
      - Sources/FullDiskAccess.swift
      - Sources/LaunchAtLogin.swift
      - Sources/ResultActions.swift
      - Sources/SearchClient.swift
      - Sources/SearchPresentationCoordinator.swift
      - Tests/AppModelTests
    dependencies:
      - package: IndexCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everythingmac.app-model-tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
  EverythingMacPresentationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Sources/SearchPresentationCoordinator.swift
      - Tests/PresentationTests
    dependencies:
      - package: IndexCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everythingmac.presentation-tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
  EverythingMacServiceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Shared/ServiceProtocol.swift
      - Shared/AutomationAccess.swift
      - Shared/ConnectionTrust.swift
      - ServiceSources/Search/SearchService.swift
      - Sources/IndexActor.swift
      - Tests/ServiceTests
    dependencies:
      - package: IndexCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everythingmac.service-tests
        GENERATE_INFOPLIST_FILE: YES
  EverythingMacShortcutTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Sources/GlobalShortcut.swift
      - Sources/CarbonGlobalShortcutRegistrar.swift
      - Sources/GlobalShortcutRecorder.swift
      - Sources/MenuBarPreference.swift
      - Tests/GlobalShortcutTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everythingmac.shortcut-tests
        GENERATE_INFOPLIST_FILE: YES
  EverythingMacCLITests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Shared/ServiceProtocol.swift
      - CLISources/CLICommand.swift
      - Tests/CLITests
    dependencies:
      - package: IndexCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everythingmac.cli-tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
  EverythingMacCLI:
    type: tool
    platform: macOS
    sources: [Shared, CLISources]
    dependencies:
      - package: IndexCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everythingmac.cli
        PRODUCT_NAME: everythingmac
        SKIP_INSTALL: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ENABLE_HARDENED_RUNTIME: YES
  EverythingMacIndexingService:
    type: tool
    platform: macOS
    sources:
      - Shared
      - ServiceSources/Indexing
      - Sources/IndexActor.swift
      - Sources/FullDiskAccess.swift
    dependencies:
      - package: IndexCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everythingmac.app
        PRODUCT_NAME: EverythingMacIndexingService
        MARKETING_VERSION: "0.9.7"
        CURRENT_PROJECT_VERSION: "24"
        SKIP_INSTALL: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ENABLE_HARDENED_RUNTIME: YES
  EverythingMacSearchService:
    type: tool
    platform: macOS
    sources: [Shared, ServiceSources/Search]
    dependencies:
      - package: IndexCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everythingmac.search
        PRODUCT_NAME: EverythingMacSearchService
        SKIP_INSTALL: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ENABLE_HARDENED_RUNTIME: YES
  EverythingMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes: [IndexActor.swift]
      - Shared
      - Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLName: com.everythingmac.search
            CFBundleURLSchemes: [everythingmac]
    entitlements:
      path: EverythingMac.entitlements
    dependencies:
      - package: IndexCore
      - target: EverythingMacIndexingService
        embed: false
      - target: EverythingMacSearchService
        embed: false
      - target: EverythingMacCLI
        embed: false
    postBuildScripts:
      - name: Embed Background Services
        inputFiles:
          - "$(BUILT_PRODUCTS_DIR)/EverythingMacIndexingService"
          - "$(BUILT_PRODUCTS_DIR)/EverythingMacSearchService"
          - "$(BUILT_PRODUCTS_DIR)/everythingmac"
          - "$(SRCROOT)/LaunchAgents/com.everythingmac.indexing-agent.plist"
          - "$(SRCROOT)/LaunchAgents/com.everythingmac.search.plist"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/MacOS/EverythingMacIndexingService"
          - "$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/MacOS/EverythingMacSearchService"
          - "$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/MacOS/everythingmac"
          - "$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Library/LaunchAgents/com.everythingmac.indexing-agent.plist"
          - "$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Library/LaunchAgents/com.everythingmac.search.plist"
        script: |
          set -euo pipefail
          executable_dir="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/MacOS"
          agent_dir="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/Library/LaunchAgents"
          mkdir -p "${agent_dir}"
          ditto "${BUILT_PRODUCTS_DIR}/EverythingMacIndexingService" "${executable_dir}/EverythingMacIndexingService"
          ditto "${BUILT_PRODUCTS_DIR}/EverythingMacSearchService" "${executable_dir}/EverythingMacSearchService"
          ditto "${BUILT_PRODUCTS_DIR}/everythingmac" "${executable_dir}/everythingmac"
          if [[ "${CODE_SIGNING_ALLOWED:-YES}" != "NO" && -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]]; then
            /usr/bin/codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" --identifier com.everythingmac.app --options runtime "${executable_dir}/EverythingMacIndexingService"
          fi
          ditto "${SRCROOT}/LaunchAgents/com.everythingmac.indexing-agent.plist" "${agent_dir}/com.everythingmac.indexing-agent.plist"
          ditto "${SRCROOT}/LaunchAgents/com.everythingmac.search.plist" "${agent_dir}/com.everythingmac.search.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everythingmac.app
        MARKETING_VERSION: "0.9.7"
        CURRENT_PROJECT_VERSION: "24"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: EverythingMac.entitlements
        SWIFT_VERSION: "6.0"
        # The local build script selects a signing identity at build time. Never ship
        # a repository with one contributor's certificate or team hard-coded.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ENABLE_HARDENED_RUNTIME: YES
