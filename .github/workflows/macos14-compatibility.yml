name: macOS 14 compatibility smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/macos14-compatibility.yml
      - scripts/check-macos14-compatibility.sh
      - App/**
      - Sources/**
      - Package.swift
      - Package.resolved

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: macos-14
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      DERIVED_DATA: ${{ github.workspace }}/.EverythingMac-macos14-derived-data
    steps:
      - uses: actions/checkout@v6
      - name: Select the macOS 14 runner toolchain
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          sw_vers
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build the app and extract App Intents metadata
        run: |
          xcodegen generate --spec App/project.yml --project App
          xcodebuild -project App/EverythingMac.xcodeproj \
            -scheme EverythingMac \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Verify metadata and launch the app
        run: scripts/check-macos14-compatibility.sh "$DERIVED_DATA"
      - name: Verify Shortcuts discovers the action
        run: |
          xcodebuild -project App/EverythingMac.xcodeproj \
            -scheme EverythingMacShortcutsUITests \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA" \
            -destination 'platform=macOS' \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos14-app-intents-metadata
          path: ${{ env.DERIVED_DATA }}/Build/Products/Release/EverythingMac.app/Contents/Resources/Metadata.appintents
          if-no-files-found: warn
