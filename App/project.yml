name: EverythingMac
options:
  bundleIdPrefix: com.everythingmac
  deploymentTarget:
    macOS: "14.0"
packages:
  IndexCore:
    path: ..
targets:
  EverythingMac:
    type: application
    platform: macOS
    sources: [Sources, Assets.xcassets]
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    entitlements:
      path: EverythingMac.entitlements
    dependencies:
      - package: IndexCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everythingmac.app
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "6"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: EverythingMac.entitlements
        SWIFT_VERSION: "6.0"
        # The local build script selects a signing identity at build time. Never ship
        # a repository with one contributor's certificate or team hard-coded.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ENABLE_HARDENED_RUNTIME: YES
